# zCAISAgent 模型路由配置
# Python 3.11+ 的 tomllib 直接解析，零依赖。

# 默认 provider：当调用方未显式指定 reasoning_effort 时直接使用。
model_provider = "deepseek"

# reasoning_effort 全量合法值；用于构建就近双向降级链。
effort_levels = ["low", "high", "max"]

# —— purpose → reasoning_effort 映射 ——
# 未命中的 purpose 走 default。
[purpose_effort]
synthesize = "low"
synthesize_retry = "low"
direct_answer = "low"
analyze = "high"
plan = "high"
reflect = "max"
verify = "max"
grade = "high"
repair = "high"
rerank = "low"
extract = "low"
default = "high"

# —— 语义向量检索 ——
# enabled=true 时注册 vector 检索源（内存余弦检索，chunk 向量懒构建）；
# 服务不可用时该源自动降级，不影响词法链路。环境变量
# ZCAISAGENT_EMBEDDING_ENABLED 可覆盖开关。
[embedding]
enabled = true
model = "qwen3.7-text-embedding-flash"
base_url = "https://maas.qianwenaiapi.com/compatible-mode/v1"
key_env = "AI_KEY_QW"

# —— LLM 相关性重排 ——
# enabled=true 时检索融合后重排 evidence.relevance；不可用或关闭时回退
# 词法相关性逻辑。环境变量 ZCAISAGENT_RERANK_ENABLED 可覆盖开关。
# 装配策略：enabled=true 且配置了 model/base_url 时优先调用专用 rerank
# 端点；不可用时自动回退——有 [embedding] 走语义余弦重排，否则回退
# LLM chat 打分。base_url 为完整端点 URL；style="dashscope" 用原生
# 格式（input.query/input.documents → output.results），style="cohere"
# 用 Jina/Cohere 兼容格式（顶层 query/documents → results）。
[rerank]
enabled = false
model = "qwen3.7-text-rerank"
base_url = "https://maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank"
style = "dashscope"
key_env = "AI_KEY_QW"

# —— 检索增强 ——
# HyDE：开放问题先用模型生成假设性答案再检索；默认关闭，失败自动跳过。
# ZCAISAGENT_HYDE_ENABLED 可覆盖开关。
# 父子块：parent_child_enabled=true 时子块携带父块正文用于合成；
# max_context_tokens 限制送入合成的证据正文预算，防止父块膨胀上下文。
[retrieval]
hyde_enabled = false
hyde_max_tokens = 256
parent_child_enabled = false
parent_max_chars = 1800
max_context_tokens = 6000
# 知识库文档 ACL：默认 public；按文件名覆盖，配合 [security].acl_tokens_by_role
# 实现角色可见范围（admin=全部，teacher=除 it_support 外，student=仅 it_support）。
acl_default = ["public"]

[retrieval.acl_by_file]
"it_support.md" = ["it_support"]

# —— pgvector 持久化 ——
# enabled=true 时启动阶段连接 Postgres 并加载 chunks；连接失败自动回退内存。
# 密钥/DSN 从 dsn_env 指向的环境变量读取（ZCAISAGENT_DATABASE_ENABLED 可覆盖开关）。
[database]
enabled = false
dsn_env = "ZCAISAGENT_DATABASE_URL"
dimensions = 1024

# —— 模型提供者定义 ——
# key_env 是环境变量名，启动时优先从 .env 读取实际密钥，缺失时回退系统环境变量；
# base_url 必须不带尾部 `/`，适配器内部会补。
# cost_in / cost_out 为单价（$/1M tokens），用于成本计量；0 表示未配置，
# 回退全局 ZCAISAGENT_INPUT/OUTPUT_PRICE_PER_MTOK。以下为示例单价，请按账单修改。

[model_providers.modelscope-ds-flash]
name = "MS-Deepseek-flash"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
base_url = "https://api-inference.modelscope.cn/v1"
key_env = "AI_KEY_MS"
context_window = 400000
reasoning_effort = "low"
cost_in = 0.28
cost_out = 0.42

[model_providers.modelscope-glm-flash]
name = "GLM-5.3-Flash"
model = "ZhipuAI/GLM-5.3-Flash"
base_url = "https://api-inference.modelscope.cn/v1"
key_env = "AI_KEY_MS"
context_window = 400000
reasoning_effort = "low"
cost_in = 0.20
cost_out = 0.60

[model_providers.deepseek]
name = "Deepseek-flash"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
key_env = "AI_KEY_DS"
context_window = 800000
reasoning_effort = "high"
cost_in = 0.28
cost_out = 0.42

[model_providers.qwen]
name = "Qwen-3.8-flash"
model = "qwen3.8-flash"
base_url = "https://maas.qianwenaiapi.com/compatible-mode/v1"
key_env = "AI_KEY_QW"
context_window = 800000
reasoning_effort = "high"
cost_in = 0.25
cost_out = 1.00

[model_providers.deepseek-pro]
name = "Deepseek-v4-Pro"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
key_env = "AI_KEY_DS"
context_window = 800000
reasoning_effort = "max"
cost_in = 0.28
cost_out = 0.42

[model_providers.qwen-max]
name = "Qwen-3.8-Max"
model = "qwen3.8-max-0902"
base_url = "https://maas.qianwenaiapi.com/compatible-mode/v1"
key_env = "AI_KEY_QW"
context_window = 800000
reasoning_effort = "max"
cost_in = 0.60
cost_out = 2.40

# —— M2 治理配置（默认关闭 / 最小权限） ——
# [security] 角色 → scopes 与 ACL token 映射；未声明角色默认无 scope。
# identity 取值 api_key / oidc；OIDC 走 introspection，客户端密钥只从环境变量读取。
[security]
identity = "api_key"
# 模拟用户角色由 [[n2sql.users]] 的 user_id → role 映射决定；未配置用户默认无角色（拒绝）。
roles = { support = ["retrieve", "tool:read", "run:create"], teacher = ["retrieve", "tool:read", "run:create"], student = ["retrieve", "tool:read", "run:create"], admin = ["retrieve", "tool:read", "tool:write", "run:create", "run:approve", "admin:read", "admin:write"] }
acl_tokens_by_role = { support = ["public"], teacher = ["public"], student = ["it_support"], admin = ["public", "finance", "it_support"] }

[security.oidc]
introspection_url = ""
client_id = ""
client_secret_env = "ZCAISAGENT_OIDC_CLIENT_SECRET"
timeout_s = 5.0

# OPA 策略端点；url 为空时使用内置 RBAC。
[security.opa]
url = ""
timeout_s = 3.0

# [tools] 外部工具接入；MCP / OpenAPI / SQL 默认留空，内置工单写工具默认关闭。
[tools]
enable_kb_search = true
enable_ticket = false
mcp_servers = []
openapi = {}
sql = {}

# —— 智能问数（NL2SQL） ——
# MySQL 连接只从 *_env 指向的环境变量读取；password 仅接受环境变量，避免密钥进入 git。
# 连接参数缺失时 /v1/n2sql 返回 503，聊天链路不会触发数据查询。
[n2sql]
enabled = true
max_rows = 100
timeout_s = 30.0
host_env = "ZCAISAGENT_N2SQL_HOST"
port_env = "ZCAISAGENT_N2SQL_PORT"
user_env = "ZCAISAGENT_N2SQL_USER"
password_env = "ZCAISAGENT_N2SQL_PASSWORD"
database_env = "ZCAISAGENT_N2SQL_DATABASE"
tables = ["courses", "students", "scores"]
schema = """
-- 课程表
CREATE TABLE courses (
  courseID CHAR(10) NOT NULL PRIMARY KEY COMMENT '课程ID',
  courseName VARCHAR(50) NOT NULL COMMENT '课程名称',
  courseTeacher VARCHAR(50) NOT NULL COMMENT '课程老师'
) COMMENT='课程信息表';
-- 学生表
CREATE TABLE students (
  studentID CHAR(10) NOT NULL PRIMARY KEY COMMENT '学生ID',
  studentName VARCHAR(50) NOT NULL COMMENT '学生姓名',
  studentSex ENUM('男', '女') NOT NULL COMMENT '性别'
) COMMENT='学生信息表';
-- 成绩表
CREATE TABLE scores (
  scoreID CHAR(36) NOT NULL PRIMARY KEY COMMENT '成绩唯一标识',
  courseID CHAR(10) NOT NULL COMMENT '课程ID',
  studentID CHAR(10) NOT NULL COMMENT '学生ID',
  scoreYear YEAR NOT NULL COMMENT '考试年度',
  score DECIMAL(5,1) NOT NULL COMMENT '考试分数'
) COMMENT='学生成绩记录表';
"""

# —— 模拟用户 → 数据可见范围（未知 user_id 默认拒绝） ——
# role=admin 不限制；teacher 按 teacher_name 限定本人课程；
# student 按 student_id 限定本人成绩。过滤条件由服务端强制注入，模型无法绕过。
[[n2sql.users]]
user_id = "dev"
role = "admin"
label = "管理员"

[[n2sql.users]]
user_id = "u_admin"
role = "admin"
label = "管理员"

[[n2sql.users]]
user_id = "web"
role = "admin"
label = "Web 控制台"

[[n2sql.users]]
user_id = "t_liang"
role = "teacher"
label = "梁文锋（教师）"
teacher_name = "梁文锋"

[[n2sql.users]]
user_id = "t_li"
role = "teacher"
label = "李沐（教师）"
teacher_name = "李沐"

[[n2sql.users]]
user_id = "s_s1"
role = "student"
label = "高圆圆（学生）"
student_id = "S1"

[[n2sql.users]]
user_id = "s_s10"
role = "student"
label = "张昕懿（学生）"
student_id = "S10"

# [memory] 三类记忆；working 由 RunState 承担，episodic/semantic/procedural 落进程内存储。
# ttl_s=0 表示不过期；环境变量 ZCAISAGENT_MEMORY_ENABLED /
# ZCAISAGENT_MEMORY_DISTILL_ENABLED 可覆盖开关。
[memory]
enabled = true
distill_enabled = true
max_items = 200
ttl_s = 0

# [cache] 结果缓存；默认关闭，仅缓存非流式确定性结果。
# enabled=true 时启用检索缓存，llm_enabled=true 时额外缓存 temperature=0 的 LLM 请求；
# 环境变量 ZCAISAGENT_CACHE_ENABLED / ZCAISAGENT_CACHE_LLM_ENABLED 可覆盖开关。
# backend=redis 时需要可选依赖 redis（pip install -e ".[redis]"），连接失败自动回退 memory。
# 环境变量 ZCAISAGENT_CACHE_BACKEND / ZCAISAGENT_REDIS_URL / ZCAISAGENT_REDIS_TIMEOUT_S 可覆盖。
[cache]
enabled = false
ttl_s = 300
max_entries = 1000
llm_enabled = true
backend = "memory"
redis_url = "redis://localhost:6379/0"
redis_timeout_s = 1.0

# [scheduler] 定时任务；默认关闭，调度器只产生 Run。
[scheduler]
enabled = false
tick_s = 30

# [events] Webhook 事件投递；默认关闭。
# enabled=true 且 webhook_urls 非空时才装配 WebhookEventSink，否则容器保持 events=None。
# 签名密钥只从 secret_env 指向的环境变量读取（不落盘）；5xx/429/网络异常按指数退避
# 重试 max_retries 次，最终失败写入 dead_letter_path 指定的 JSONL。
[events]
enabled = false
webhook_urls = []
secret_env = "ZCAISAGENT_EVENT_SECRET"
max_retries = 3
dead_letter_path = ".zcaisagent/dead_letter.jsonl"

# [secret] 密钥来源；默认从环境变量读取，Vault 为可选实现。
# provider=vault 且 vault_addr 非空时使用 Vault KV v2（token 取自 vault_token_env），
# 读取失败自动回退环境变量，health 的 secret 项降级。
[secret]
provider = "env"
vault_addr = ""
vault_token_env = "VAULT_TOKEN"
vault_mount = "secret"
vault_path = "zcaisagent"

# [studio] Studio 看板数据源；eval_report_path 为 eval --out 的默认产物位置，
# 缺失时回退 baseline_dir 下 mtime 最新的 *.json。
# 环境变量 ZCAISAGENT_STUDIO_EVAL_REPORT / ZCAISAGENT_STUDIO_EVAL_GATE /
# ZCAISAGENT_STUDIO_BASELINE_DIR 可覆盖对应路径。
[studio]
eval_report_path = "data/eval/latest.json"
eval_gate_path = "configs/eval_gate.toml"
baseline_dir = "data/eval/baselines"

# —— 可观测（细粒度事件 + 可选 OTel） ——
# emit_events=true 时向 trace/EventSink 发射细粒度事件（run/step/llm/retrieval/
# evidence/tool/approval/verify/finish）。otel_enabled 需可选依赖 .[otel]，
# 初始化失败自动回退 JSONL。环境变量 ZCAISAGENT_OBS_EMIT_EVENTS / ZCAISAGENT_OTEL_* 可覆盖。
[observability]
emit_events = true
otel_enabled = false
otel_endpoint = ""
service_name = "zcaisagent"
sample_ratio = 1.0

# —— 护栏模型层 ——
# model_enabled=true 时在规则护栏之外叠加 LLM 分类（purpose），失败按 fail_open 放行。
# 环境变量 ZCAISAGENT_GUARDRAIL_MODEL_ENABLED / _FAIL_OPEN 可覆盖。
[guardrail]
model_enabled = false
purpose = "guardrail"
fail_open = true

# —— 语义校验（NLI judge） ——
# semantic_verify_enabled=true 时 verify 节点用 LLM 判定 claim 是否被证据蕴含；
# 失败按 fail_open 回退词面校验。环境变量 ZCAISAGENT_SEMANTIC_VERIFY_ENABLED 可覆盖。
[evaluator]
semantic_verify_enabled = false
purpose = "verify"
min_entailment = 0.8
fail_open = true

# —— 技能目录 ——
# 启动时扫描 dir 下的 */SKILL.md；解析失败跳过并记健康信息。
# 环境变量 ZCAISAGENT_SKILLS_ENABLED / ZCAISAGENT_SKILLS_DIR 可覆盖。
[skills]
enabled = true
dir = "skills"

# —— 检查点持久化 ——
# backend=jsonl（默认，压缩+索引）| postgres（需 [database] 启用，失败回退 JSONL）。
# 环境变量 ZCAISAGENT_CHECKPOINT_BACKEND / _COMPACT / _THRESHOLD / _KEEP 可覆盖。
[checkpoint]
backend = "jsonl"
compact_enabled = true
compact_threshold_lines = 20
compact_keep = 1
