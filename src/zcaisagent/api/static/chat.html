<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zCAISAgent · 控制台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
  :root {
    --paper: #0f110e;
    --panel: #151812;
    --panel-2: #1b1f18;
    --line: #2a2e26;
    --ink: #e9e7dc;
    --muted: #97998c;
    --gold: #d8a657;
    --gold-soft: rgba(216, 166, 87, .12);
    --danger: #d8735f;
    --ok: #8fbf6a;
    --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", monospace;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-columns: 216px 1fr;
    grid-template-rows: minmax(0, 1fr);
    overflow: hidden;
  }

  /* 细网格纹理，制造纸面质感 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index: 0;
  }

  /* ── 侧栏 ── */
  .rail {
    position: relative;
    z-index: 1;
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 28px 22px 0;
    display: flex;
    flex-direction: column;
    gap: 26px;
    overflow-y: auto;
    min-height: 0;
  }

  .brand h1 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .01em;
    margin: 10px 0 4px;
  }

  .brand p {
    margin: 0;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pulse {
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(143, 191, 106, .55);
    animation: pulse 2.4s infinite;
  }

  @keyframes pulse {
    70%  { box-shadow: 0 0 0 7px rgba(143, 191, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(143, 191, 106, 0); }
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 9px 10px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }

  .field input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  .hint {
    margin: 6px 0 0;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .meta {
    border-top: 1px solid var(--line);
    padding-top: 18px;
    display: grid;
    gap: 9px;
    font-family: var(--mono);
    font-size: 11px;
  }

  .meta div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .meta span { color: var(--muted); }

  .meta code {
    color: var(--ink);
    max-width: 140px;
    word-break: break-all;
    line-height: 1.4;
    cursor: pointer;
    text-align: right;
  }

  .meta code:hover { color: var(--gold); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--panel-2);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 12px;
    padding: 7px 16px;
    border-radius: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .rail-actions {
    margin-top: auto;
    position: sticky;
    bottom: 0;
    z-index: 2;
    display: grid;
    gap: 10px;
    background: var(--panel);
    padding: 16px 0 28px;
  }

  button {
    font-family: var(--sans);
    cursor: pointer;
    border-radius: 4px;
    transition: background .18s, border-color .18s, color .18s, transform .08s;
  }

  .ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    padding: 9px 12px;
    letter-spacing: .04em;
  }

  .ghost:hover { border-color: var(--gold); color: var(--gold); }

  .docs {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 2px;
    align-self: center;
  }

  .docs:hover { color: var(--gold); border-color: var(--gold); }

  /* ── 主区 ── */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 40px 16px;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }

  .topbar h2 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    margin: 0;
    letter-spacing: .02em;
  }

  .topbar .stage {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage[data-state="running"] { color: var(--gold); }

  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 40px 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    scroll-behavior: smooth;
  }

  /* 空状态 */
  .empty {
    margin: auto;
    max-width: 460px;
    text-align: left;
    animation: rise .5s ease both;
  }

  .empty .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .empty h3 {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.25;
    font-weight: 500;
    margin: 0 0 14px;
  }

  .empty p {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.8;
    margin: 0 0 24px;
  }

  .samples { display: grid; gap: 8px; }

  .samples button {
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    padding: 12px 14px;
    opacity: 0;
    animation: rise .45s ease forwards;
  }

  .samples button:hover { border-color: var(--gold); background: var(--gold-soft); }

  .samples button:nth-child(1) { animation-delay: .06s; }
  .samples button:nth-child(2) { animation-delay: .12s; }
  .samples button:nth-child(3) { animation-delay: .18s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 消息 */
  .msg { animation: rise .35s ease both; }

  .msg.user {
    position: relative;
    align-self: flex-end;
    max-width: 72%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px 10px 2px 10px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 用户消息的复制 / 修改图标 */
  .msg-actions {
    position: absolute;
    right: 2px;
    bottom: -24px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .18s;
  }

  .msg.user:hover .msg-actions,
  .msg-actions:focus-within { opacity: 1; }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
  }

  .icon-btn:hover { color: var(--gold); border-color: var(--gold); }

  .icon-btn.copied { color: var(--ok); border-color: rgba(143, 191, 106, .4); }

  @media (hover: none) {
    .msg-actions { opacity: 1; }
  }

  .msg.agent {
    max-width: 760px;
    padding-left: 18px;
    border-left: 2px solid var(--gold);
  }

  .msg.agent .role {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 9px;
  }

  .msg.agent .body {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.85;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .caret {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--gold);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s steps(2) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 4px 0;
  }

  .thinking i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    animation: bounce 1.2s infinite;
  }

  .thinking i:nth-child(2) { animation-delay: .15s; }
  .thinking i:nth-child(3) { animation-delay: .3s; }

  @keyframes bounce {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30%           { opacity: 1; transform: translateY(-4px); }
  }

  /* 元信息 */
  .agent-meta {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .badge {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 7px;
    color: var(--muted);
  }

  .badge.high   { color: var(--gold); border-color: rgba(216, 166, 87, .45); }
  .badge.low,
  .badge.warn   { color: var(--danger); border-color: rgba(216, 115, 95, .45); }
  .badge.ok     { color: var(--ok); border-color: rgba(143, 191, 106, .4); }

  .citations {
    margin-top: 12px;
    display: grid;
    gap: 7px;
  }

  .citation {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }

  .citation b {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--gold);
    margin-bottom: 4px;
  }

  /* 执行步骤（默认折叠） */
  .steps {
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  .steps > summary,
  .step > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .steps > summary::-webkit-details-marker,
  .step > summary::-webkit-details-marker { display: none; }

  .steps > summary::before,
  .step > summary::before {
    content: "▸";
    flex: none;
    font-size: 9px;
    color: var(--muted);
    transition: transform .18s;
  }

  .steps[open] > summary::before,
  .step[open] > summary::before { transform: rotate(90deg); }

  .steps > summary {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .steps > summary:hover { color: var(--gold); }

  .step-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
  }

  .step {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
  }

  .step > summary {
    justify-content: flex-start;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
  }

  .step-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .step-tags {
    flex: none;
    margin-left: auto;
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--muted);
  }

  .step-body {
    display: grid;
    gap: 8px;
    margin-top: 8px;
  }

  .step-block > b {
    display: block;
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .step-block pre {
    margin: 4px 0 0;
    padding: 8px 10px;
    max-height: 240px;
    overflow: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .step-block pre::-webkit-scrollbar { width: 6px; }
  .step-block pre::-webkit-scrollbar-thumb { background: #2c3128; border-radius: 4px; }

  /* 问数图表与导出 */
  .chart-card {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px 10px;
  }

  .chart-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .chart-card svg { display: block; width: 100%; height: auto; }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .chart-legend i {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 6px;
  }

  .chart-empty { color: var(--muted); font-size: 12px; }

  .export-btn {
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 4px;
    letter-spacing: .04em;
  }

  .export-btn:hover:not(:disabled) { background: var(--gold-soft); }
  .export-btn:disabled { opacity: .6; cursor: progress; }

  /* 输入区 */
  .composer {
    flex: none;
    padding: 16px 40px 26px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  .composer-inner {
    position: relative;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 12px 12px 16px;
    transition: border-color .2s, box-shadow .2s;
  }

  .composer-inner:focus-within {
    border-color: rgba(216, 166, 87, .55);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  /* 斜杠命令菜单 */
  .cmd-menu {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 8px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
    overflow: hidden;
    z-index: 30;
  }

  .cmd-menu[hidden] { display: none; }

  .cmd-menu-head {
    padding: 9px 14px 7px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .cmd-list { max-height: 240px; overflow-y: auto; }

  .cmd-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-align: left;
  }

  .cmd-item:last-child { border-bottom: 0; }
  .cmd-item:hover,
  .cmd-item.active { background: var(--gold-soft); }

  .cmd-item .cmd-name {
    flex: none;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--gold);
  }

  .cmd-item .cmd-desc { font-size: 11.5px; color: var(--muted); }

  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.65;
    max-height: 160px;
    padding: 3px 0;
  }

  textarea::placeholder { color: #6c6e63; }

  .send {
    flex: none;
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #17140c;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 9px 18px;
    border-radius: 5px;
  }

  .send:hover:not(:disabled) { background: #e6b96f; }

  .send:active:not(:disabled) { transform: translateY(1px); }

  .send:disabled {
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }

  .foot {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-family: var(--mono);
    font-size: 10px;
    color: #6c6e63;
    letter-spacing: .04em;
  }

  .error {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--danger);
  }

  /* 滚动条 */
  #messages::-webkit-scrollbar, .rail::-webkit-scrollbar { width: 7px; }
  #messages::-webkit-scrollbar-thumb, .rail::-webkit-scrollbar-thumb {
    background: #2c3128;
    border-radius: 4px;
  }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .rail {
      flex-direction: row;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      overflow-y: hidden;
      flex-wrap: nowrap;
    }
    .brand h1 { font-size: 16px; margin: 0; }
    .brand p, .pulse, .meta, .hint { display: none; }
    .field { min-width: 130px; }
    .field label { margin-bottom: 4px; }
    .rail-actions {
      position: static;
      margin-top: 0;
      padding: 0;
      grid-auto-flow: column;
      flex: none;
    }
    .docs { display: none; }
    #messages { padding: 24px 18px 12px; }
    .topbar, .composer { padding-left: 18px; padding-right: 18px; }
    .msg.user { max-width: 88%; }
    .empty h3 { font-size: 24px; }
  }
</style>
</head>
<body>

<aside class="rail">
  <div class="brand">
    <span class="pulse"></span>
    <h1>zCAISAgent</h1>
    <p>Compound AI Systems</p>
  </div>

  <div class="field">
    <label for="apiKey">X-API-Key</label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="dev-key">
    <p class="hint">对应 .env 中 ZCAISAGENT_API_KEY 的值</p>
  </div>

  <div class="field">
    <label for="tenant">Tenant</label>
    <input id="tenant" value="demo" spellcheck="false">
  </div>

  <div class="field">
    <label for="userId">User</label>
    <input id="userId" value="web" spellcheck="false">
    <p class="hint">对应 config.toml 的 [[n2sql.users]]，如 s_s1 / t_liang</p>
  </div>

  <div class="meta">
    <div><span>thread</span><code id="mThread" title="点击复制">—</code></div>
    <div><span>run</span><code id="mRun" title="点击复制">—</code></div>
  </div>

  <div class="rail-actions">
    <button class="ghost" id="newThread" type="button">新会话</button>
    <a class="docs" href="/studio" target="_blank" rel="noopener">Studio ↗</a>
    <a class="docs" href="/docs" target="_blank" rel="noopener">Swagger 文档 ↗</a>
  </div>
</aside>

<main>
  <div class="topbar">
    <h2>企业知识问答</h2>
    <span class="stage" id="stage" data-state="idle">idle</span>
  </div>

  <section id="messages">
    <div class="empty" id="empty">
      <div class="eyebrow">Agentic RAG</div>
      <h3>问点什么，小燕麦去查。</h3>
      <p>答案由多节点状态机生成：分析 → 路由 → 检索 → 综合 → 校验 → 作答。证据不足时会拒绝编造。</p>
      <div class="samples">
        <button type="button">一线城市住宿标准是多少？</button>
        <button type="button">出差坐高铁有什么要求？</button>
        <button type="button">报销超标了怎么处理？</button>
      </div>
    </div>
  </section>

  <form class="composer" id="composer">
    <div class="composer-inner">
      <div class="cmd-menu" id="cmdMenu" hidden>
        <div class="cmd-menu-head">命令</div>
        <div class="cmd-list" id="cmdList"></div>
      </div>
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送 / Shift + Enter 换行；输入 / 唤起命令"></textarea>
      <button class="send" id="send" type="submit">发送</button>
    </div>
    <div class="foot">
      <span>POST /v1/chat · /v1/n2sql</span>
      <span id="hintLine">等待输入</span>
    </div>
    <div class="error" id="error" hidden></div>
  </form>
</main>

<div class="toast" id="toast">已复制</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const msgs = $('messages');
  const input = $('input');
  const sendBtn = $('send');
  const errorBox = $('error');
  const hintLine = $('hintLine');
  const stageEl = $('stage');
  const cmdMenu = $('cmdMenu');
  const cmdList = $('cmdList');

  let threadId = newThreadId();
  let busy = false;

  const COMMANDS = [
    { name: '问数', desc: '自然语言查询数据库，支持图表与 Excel 导出' },
  ];
  let menuOpen = false;
  let menuMatches = [];
  let menuIndex = 0;
  let menuQuery = '';

  // 恢复本地设置
  $('apiKey').value = localStorage.getItem('zcais.key') || 'dev-key';
  $('tenant').value = localStorage.getItem('zcais.tenant') || 'demo';
  $('userId').value = localStorage.getItem('zcais.user') || 'web';
  $('apiKey').addEventListener('change', (e) => localStorage.setItem('zcais.key', e.target.value.trim()));
  $('tenant').addEventListener('change', (e) => localStorage.setItem('zcais.tenant', e.target.value.trim()));
  $('userId').addEventListener('change', (e) => localStorage.setItem('zcais.user', e.target.value.trim()));

  $('newThread').addEventListener('click', () => {
    if (busy) return;
    threadId = newThreadId();
    $('mThread').textContent = threadId;
    $('mRun').textContent = '—';
    $('mRun').dataset.value = '';
    setStage('idle');
    document.querySelectorAll('.msg').forEach((n) => n.remove());
    $('empty').hidden = false;
    input.focus();
  });

  document.querySelectorAll('.samples button').forEach((b) => {
    b.addEventListener('click', () => {
      input.value = b.textContent.trim();
      autosize();
      input.focus();
    });
  });

  input.addEventListener('input', () => {
    autosize();
    updateCommandMenu();
  });

  input.addEventListener('keydown', (e) => {
    if (menuOpen && !e.isComposing) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        menuIndex = (menuIndex + 1) % menuMatches.length;
        renderCommandMenu();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        menuIndex = (menuIndex - 1 + menuMatches.length) % menuMatches.length;
        renderCommandMenu();
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        chooseCommand(menuMatches[menuIndex]);
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        closeCommandMenu();
        return;
      }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('composer').requestSubmit();
    }
  });

  document.addEventListener('click', (e) => {
    if (menuOpen && !e.target.closest('.composer-inner')) closeCommandMenu();
  });

  $('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    ask();
  });

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function commandQuery() {
    const match = /^\/(\S*)$/.exec(input.value);
    return match ? match[1] : null;
  }

  function closeCommandMenu() {
    cmdMenu.hidden = true;
    menuOpen = false;
    menuMatches = [];
    menuIndex = 0;
    menuQuery = '';
  }

  function renderCommandMenu() {
    cmdList.textContent = '';
    menuMatches.forEach((command, index) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'cmd-item' + (index === menuIndex ? ' active' : '');
      item.appendChild(simpleText('span', 'cmd-name', '/' + command.name));
      item.appendChild(simpleText('span', 'cmd-desc', command.desc));
      item.addEventListener('mousedown', (e) => e.preventDefault());
      item.addEventListener('click', () => chooseCommand(command));
      cmdList.appendChild(item);
    });
    cmdMenu.hidden = false;
    menuOpen = true;
  }

  function updateCommandMenu() {
    const query = commandQuery();
    if (query === null) {
      closeCommandMenu();
      return;
    }
    if (query !== menuQuery) {
      menuQuery = query;
      menuIndex = 0;
    }
    menuMatches = COMMANDS.filter((command) => command.name.startsWith(query));
    if (!menuMatches.length) {
      closeCommandMenu();
      return;
    }
    renderCommandMenu();
  }

  function chooseCommand(command) {
    input.value = '/' + command.name + ' ';
    closeCommandMenu();
    autosize();
    input.focus();
    const end = input.value.length;
    input.setSelectionRange(end, end);
  }

  function parseCommand(value) {
    const match = /^\/(\S+)\s*([\s\S]*)$/.exec(value);
    if (!match) return null;
    return { name: match[1], body: match[2].trim() };
  }

  function newThreadId() {
    return (crypto.randomUUID && crypto.randomUUID()) || 'thread_' + Date.now().toString(36);
  }

  let toastTimer = null;
  function showToast(text) {
    const toast = $('toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
  }

  async function copyText(value) {
    if (!value || value === '—') return;
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      // 非安全上下文兜底：临时 textarea + execCommand
      const box = document.createElement('textarea');
      box.value = value;
      box.style.position = 'fixed';
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      try { document.execCommand('copy'); } catch { /* 忽略 */ }
      box.remove();
    }
    showToast('已复制');
  }

  $('mThread').addEventListener('click', () => copyText(threadId));
  $('mRun').addEventListener('click', () => copyText($('mRun').dataset.value || ''));

  function setStage(text, running = false) {
    stageEl.textContent = text;
    stageEl.dataset.state = running ? 'running' : 'idle';
  }

  function showError(msg) {
    errorBox.hidden = !msg;
    errorBox.textContent = msg || '';
  }

  function simpleText(tag, cls, text) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    return el;
  }

  const ICON_COPY =
    '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5V2.5a1 1 0 0 0-1-1h-7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h1"/></svg>';
  const ICON_EDIT =
    '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5-8 8H3v-2.5z"/><path d="M2.5 14h11"/></svg>';

  function iconButton(label, svg, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.innerHTML = svg;
    btn.addEventListener('click', onClick);
    return btn;
  }

  async function copyToClipboard(text) {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }

  function appendUser(text) {
    const wrap = simpleText('div', 'msg user', text);

    const copyBtn = iconButton('复制', ICON_COPY, async () => {
      try {
        await copyToClipboard(text);
        copyBtn.classList.add('copied');
        copyBtn.title = '已复制';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.title = '复制';
        }, 1200);
      } catch {
        showError('复制失败，请手动选择文本');
      }
    });

    const editBtn = iconButton('修改', ICON_EDIT, () => {
      input.value = text;
      autosize();
      input.focus();
    });

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.appendChild(copyBtn);
    actions.appendChild(editBtn);
    wrap.appendChild(actions);

    msgs.appendChild(wrap);
    return wrap;
  }

  function appendAgent() {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.appendChild(simpleText('div', 'role', 'zCAISAgent'));

    const body = document.createElement('div');
    body.className = 'body';

    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = '<i></i><i></i><i></i>';
    body.appendChild(thinking);

    wrap.appendChild(body);
    msgs.appendChild(wrap);

    const meta = document.createElement('div');
    meta.className = 'agent-meta';
    wrap.appendChild(meta);

    const citations = document.createElement('div');
    citations.className = 'citations';
    wrap.appendChild(citations);

    const steps = document.createElement('div');
    steps.className = 'steps-host';
    wrap.appendChild(steps);

    return { wrap, body, meta, citations, steps, thinking };
  }

  function scrollToBottom(force = false) {
    const near = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 140;
    if (force || near) msgs.scrollTop = msgs.scrollHeight;
  }

  function jsonBlock(label, value) {
    const block = document.createElement('div');
    block.className = 'step-block';
    block.appendChild(simpleText('b', '', label));
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(value ?? null, null, 2);
    block.appendChild(pre);
    return block;
  }

  function buildStepNode(evt, index) {
    const data = evt.data || {};
    const item = document.createElement('details');
    item.className = 'step';

    const head = document.createElement('summary');
    head.appendChild(
      simpleText('span', 'step-name', `#${evt.step ?? index + 1} ${evt.node || 'node'}`)
    );

    const tags = [];
    if (data.model) tags.push(data.model);
    if (data.duration_ms != null) tags.push(`${Math.round(data.duration_ms)}ms`);
    if (data.tokens) tags.push(`${data.tokens} tok`);
    if (tags.length) head.appendChild(simpleText('span', 'step-tags', tags.join(' · ')));
    item.appendChild(head);

    const body = document.createElement('div');
    body.className = 'step-body';
    body.appendChild(jsonBlock('输入', data.input ?? {}));
    body.appendChild(jsonBlock('产出', data.output ?? {}));
    item.appendChild(body);

    return item;
  }

  // 从 /v1/runs/{id}/trace 取每一步的输入与产出，整体默认折叠。
  async function loadSteps(host, runId) {
    if (!runId) return;

    let events = [];
    try {
      const query = new URLSearchParams({
        tenant_id: $('tenant').value.trim() || 'demo',
        user_id: $('userId').value.trim() || 'web',
      });
      const res = await fetch(
        `/v1/runs/${encodeURIComponent(runId)}/trace?${query.toString()}`,
        { headers: { 'X-API-Key': $('apiKey').value.trim() } }
      );
      if (!res.ok) return;
      ({ events = [] } = await res.json());
    } catch {
      return;
    }

    const steps = events.filter((e) => e.type === 'step.finished');
    if (!steps.length) return;

    const details = document.createElement('details');
    details.className = 'steps';
    const summary = document.createElement('summary');
    summary.textContent = `执行步骤 · ${steps.length}`;
    details.appendChild(summary);

    const list = document.createElement('div');
    list.className = 'step-list';
    steps.forEach((e, i) => list.appendChild(buildStepNode(e, i)));
    details.appendChild(list);

    host.appendChild(details);
    scrollToBottom();
  }

  async function readSSE(response, onEvent) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let cut;
      while ((cut = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);

        let event = 'message';
        const dataLines = [];
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) continue;
        try {
          onEvent(event, JSON.parse(dataLines.join('\n')));
        } catch {
          /* 忽略无法解析的心跳块 */
        }
      }
    }
  }

  async function ask() {
    const inputText = input.value.trim();
    if (!inputText || busy) return;

    const apiKey = $('apiKey').value.trim();
    if (!apiKey) {
      showError('请先在左侧填写 X-API-Key');
      return;
    }

    // 问数命令走 /v1/chat，保留 run_id、轨迹与 Studio 记录；
    // 输出格式从命令正文识别，实际问句去掉“导出 Excel/画图”等格式词。
    let goal = inputText;
    let dataOutput = null;
    let dataQuestion = '';
    const command = parseCommand(inputText);
    if (command) {
      if (command.name !== '问数') {
        showError(`未知命令：/${command.name}`);
        return;
      }
      if (!command.body) {
        showError('请在 /问数 后输入查询内容，例如：/问数 各课程平均分');
        return;
      }
      dataOutput = detectOutput(command.body);
      dataQuestion = cleanQuestion(command.body);
      goal = `问数：${dataQuestion}`;
    }

    closeCommandMenu();
    showError('');
    busy = true;
    sendBtn.disabled = true;
    setStage('running', true);
    hintLine.textContent = '生成中…';

    $('empty').hidden = true;
    input.value = '';
    autosize();
    appendUser(inputText);
    const bubble = appendAgent();
    scrollToBottom(true);

    let text = '';
    let charCount = 0;
    let dataPayload = null;

    const render = (chunk) => {
      bubble.thinking.remove();
      text += chunk;
      bubble.body.textContent = text;
      const caret = document.createElement('span');
      caret.className = 'caret';
      bubble.body.appendChild(caret);
      charCount = text.length;
      scrollToBottom();
    };

    try {
      const response = await fetch('/v1/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': apiKey,
        },
        body: JSON.stringify({
          goal,
          thread_id: threadId,
          tenant_id: $('tenant').value.trim() || 'demo',
          user_id: $('userId').value.trim() || 'web',
        }),
      });

      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.message || detail.detail || `HTTP ${response.status}`);
      }

      await readSSE(response, (event, data) => {
        if (event === 'meta') {
          $('mRun').textContent = data.run_id || '—';
          $('mRun').dataset.value = data.run_id || '';
          $('mThread').textContent = threadId;
        } else if (event === 'token') {
          render(data.text || '');
        } else if (event === 'data_query') {
          dataPayload = data;
        } else if (event === 'stage') {
          if (data.phase === 'start' && data.node) setStage(data.node, true);
        } else if (event === 'error') {
          throw new Error(data.message || '流式生成失败');
        } else if (event === 'done') {
          finish(data);
        }
      });

      // 兜底：没有 done 事件时也清理光标
      bubble.body.querySelector('.caret')?.remove();
    } catch (err) {
      bubble.thinking.remove();
      bubble.body.textContent = '';
      bubble.wrap.classList.add('failed');
      bubble.meta.appendChild(simpleText('span', 'badge warn', '请求失败'));
      showError(String(err.message || err));
    } finally {
      busy = false;
      sendBtn.disabled = false;
      setStage('idle');
      hintLine.textContent = charCount ? `已完成 · ${charCount} 字` : '等待输入';
      setTimeout(() => scrollToBottom(true), 40);
      input.focus();
    }

    function finish(data) {
      bubble.body.querySelector('.caret')?.remove();
      // 流式正文是草稿；done.answer 是校验后的权威文本（可能被修正或拒答）。
      const finalText = (data.answer || '').trim();
      if (finalText && finalText !== text) {
        text = finalText;
        charCount = text.length;
        bubble.body.textContent = finalText;
      }
      if (!text) bubble.body.textContent = '（无内容）';

      const confidence = (data.confidence || 'low').toLowerCase();
      const level = confidence === 'high' ? 'high' : confidence === 'medium' ? '' : 'low';
      bubble.meta.appendChild(simpleText('span', `badge ${level}`.trim(), '置信度 · ' + confidence));

      const cites = data.citations || [];
      bubble.meta.appendChild(simpleText('span', 'badge', `引用 · ${cites.length}`));

      const m = data.metrics;
      if (m) {
        const secs = (Number(m.elapsed_ms || 0) / 1000).toFixed(2);
        const pct = Number(m.token_percent || 0).toFixed(1);
        const hit = Number(m.cache_hit_rate || 0).toFixed(1);
        bubble.meta.appendChild(simpleText('span', 'badge', `耗时 · ${secs}s`));
        bubble.meta.appendChild(simpleText('span', 'badge', `tokens · ${m.tokens_total}/${m.token_budget}（${pct}%）`));
        bubble.meta.appendChild(simpleText('span', 'badge', `in ${m.tokens_in} · out ${m.tokens_out}`));
        bubble.meta.appendChild(simpleText('span', 'badge', `缓存命中 · ${hit}%`));
      }

      cites.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'citation';
        card.appendChild(simpleText('b', 'cite-id', c.evidence_id || 'unknown'));
        card.appendChild(document.createTextNode((c.quote || '（无引文）').trim()));
        bubble.citations.appendChild(card);
      });

      if (dataOutput && dataPayload && dataPayload.ok) {
        bubble.meta.appendChild(simpleText('span', 'badge high', '智能问数'));
        if (dataPayload.scope) {
          bubble.meta.appendChild(simpleText('span', 'badge', `数据权限 · ${dataPayload.scope}`));
        }
        const dataRowCount = dataPayload.row_count ?? (dataPayload.rows || []).length;
        const dataRowLimit = Number(dataPayload.row_limit || 0);
        bubble.meta.appendChild(simpleText('span', 'badge', `行数 · ${dataRowCount}`));
        if (dataRowLimit && dataRowCount >= dataRowLimit) {
          bubble.meta.appendChild(
            simpleText('span', 'badge warn', `已达上限 ${dataRowLimit} 行 · 可能截断`)
          );
        }
        if (dataOutput.chart) {
          appendChart(bubble.wrap, dataPayload.columns, dataPayload.rows, dataOutput.chart);
        }
        if (dataOutput.excel) {
          appendExport(bubble.wrap, dataPayload, dataQuestion, apiKey);
        }
      }

      loadSteps(bubble.steps, data.run_id);
    }
  }

  // ── 问数命令：格式识别 / 图表 / Excel ──

  function detectOutput(text) {
    const excel = /excel/i.test(text);
    let chart = null;
    if (/饼图|占比|比例|百分比|份额/.test(text)) chart = 'pie';
    else if (/折线图|趋势|走势|随时间/.test(text)) chart = 'line';
    else if (/条形图/.test(text)) chart = 'hbar';
    else if (/柱状图/.test(text)) chart = 'bar';
    else if (/排名|排行|前\s*\d+|top\s*\d+|第几名/i.test(text)) chart = 'hbar';
    else if (/图表|统计图|可视化|统计|分布|对比/.test(text)) chart = 'auto';
    return { excel, chart };
  }

  // 输出格式词不该进入 SQL 生成，去掉后再问数。
  function cleanQuestion(text) {
    let cleaned = text
      .replace(
        /(?:导出|生成|输出|保存|另存)(?:为|成|到|至)?\s*excel(?:文件|表格|档)?/gi,
        ' '
      )
      .replace(/excel(?:文件|表格|档)?\s*(?:导出|生成|输出|保存|另存)?/gi, ' ')
      .replace(
        /(?:请|帮我|麻烦)?(?:用|以|画|绘制|生成|显示|展示|输出|给我看)?\s*(?:一个|一张|一份)?\s*(?:折线图|柱状图|条形图|饼图|统计图|图表|可视化)(?:来)?(?:显示|展示|呈现|导出)?/g,
        ' '
      )
      .replace(/\s+/g, ' ')
      .replace(/^[，,。；;、\s]+|[，,。；;、\s]+$/g, '')
      .trim();

    cleaned = cleaned
      .replace(
        /^(?:请|帮我|麻烦)?\s*(?:把|将)?\s*(?:导出|生成|输出|保存|另存)(?:为|成|到|至)?\s*/,
        ''
      )
      .replace(/^(?:请|帮我|麻烦)?\s*(?:把|将)\s*/, '')
      .replace(/\s*(?:导出|生成|输出|保存|另存)(?:到|至|为|成)?\s*$/, '')
      .replace(/[，,。；;、\s]*(?:到|至|为|成)\s*$/, '')
      .replace(/[，,。；;、\s]+$/, '')
      .trim();

    return cleaned || text;
  }

  function exportStamp() {
    const now = new Date();
    const pad = (value) => String(value).padStart(2, '0');
    return [
      now.getFullYear(),
      pad(now.getMonth() + 1),
      pad(now.getDate()),
      '_',
      pad(now.getHours()),
      pad(now.getMinutes()),
      pad(now.getSeconds()),
    ].join('');
  }

  function appendExport(host, data, question, apiKey) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'export-btn';
    button.textContent = '导出 Excel';

    button.addEventListener('click', async () => {
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = '生成中…';
      try {
        const response = await fetch('/v1/n2sql/export', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': apiKey,
          },
          body: JSON.stringify({
            question,
            columns: data.columns || [],
            rows: data.rows || [],
            tenant_id: $('tenant').value.trim() || 'demo',
            user_id: $('userId').value.trim() || 'web',
          }),
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || detail.message || `HTTP ${response.status}`);
        }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `问数结果_${exportStamp()}.xlsx`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        showToast('Excel 已生成');
      } catch (err) {
        showError(String(err.message || err));
      } finally {
        button.disabled = false;
        button.textContent = '导出 Excel';
      }
    });

    host.appendChild(button);
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CHART_COLORS = ['#d8a657', '#8fbf6a', '#7fa6c9', '#d8735f', '#b08cc9', '#e0cf9a'];
  const CHART_FONTS = '"Cascadia Mono", Consolas, "PingFang SC", sans-serif';
  const CHART_TITLES = { bar: '柱状图', hbar: '排名图', line: '折线图', pie: '饼图' };

  function svgEl(name, attrs) {
    const element = document.createElementNS(SVG_NS, name);
    if (attrs) {
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
    }
    return element;
  }

  function svgText(x, y, text, attrs) {
    const element = svgEl(
      'text',
      Object.assign(
        { x, y, fill: '#97998c', 'font-size': 11, 'font-family': CHART_FONTS },
        attrs || {}
      )
    );
    element.textContent = String(text);
    return element;
  }

  function toNumber(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    if (value === null || value === undefined) return null;
    const text = String(value).trim().replace(/,/g, '');
    if (!text) return null;
    const number = Number(text);
    return Number.isFinite(number) ? number : null;
  }

  function formatNumber(value) {
    if (Math.abs(value) >= 10000) return value.toLocaleString('zh-CN');
    if (Number.isInteger(value)) return String(value);
    return String(Math.round(value * 100) / 100);
  }

  function clipLabel(value, limit) {
    const text = String(value);
    const max = limit || 14;
    return text.length > max ? `${text.slice(0, max - 1)}…` : text;
  }

  function niceScale(maxValue, ticks) {
    const count = ticks || 4;
    if (!(maxValue > 0)) return { max: 1, step: 1 / count };
    const rough = maxValue / count;
    const base = Math.pow(10, Math.floor(Math.log10(rough)));
    const ratio = rough / base;
    let step = base;
    if (ratio <= 1) step = base;
    else if (ratio <= 2) step = 2 * base;
    else if (ratio <= 2.5) step = 2.5 * base;
    else if (ratio <= 5) step = 5 * base;
    else step = 10 * base;
    return { max: step * count, step };
  }

  function prepareChartData(columns, rows) {
    const cols = columns && columns.length ? columns : Object.keys((rows && rows[0]) || {});
    if (!cols.length || !rows || !rows.length) return { labels: [], series: [] };

    const numeric = cols.filter((column) => {
      let seen = false;
      for (const row of rows) {
        const raw = row[column];
        if (raw === null || raw === undefined || raw === '') continue;
        if (toNumber(raw) === null) return false;
        seen = true;
      }
      return seen;
    });

    let labelColumn = cols.find((column) => !numeric.includes(column));
    let numericColumns = numeric;
    // 年份等维度也可能被解析成数值；首列呈时间序列时优先作为横轴。
    if (!labelColumn && numeric.length > 1) {
      const first = cols[0];
      if (rows.every((row) => looksTemporal(row[first]))) {
        labelColumn = first;
        numericColumns = numeric.filter((column) => column !== first);
      }
    }

    const labels = rows.map((row, index) =>
      labelColumn ? String(row[labelColumn] ?? index + 1) : String(index + 1)
    );
    const series = numericColumns.slice(0, 4).map((column, index) => ({
      name: column,
      color: CHART_COLORS[index % CHART_COLORS.length],
      data: rows.map((row) => toNumber(row[column]) ?? 0),
    }));
    return { labels, series };
  }

  function looksTemporal(label) {
    const text = String(label).trim();
    return /^\d{4}$|^\d{4}[-/年.]\d{1,2}([-/月.]\d{1,2})?$|^\d{1,2}月$|^第?[一二三四1-4]季度$|^Q[1-4]$/i.test(
      text
    );
  }

  function resolveChartType(requested, labels) {
    if (requested && requested !== 'auto') return requested;
    if (labels.length > 2 && labels.every(looksTemporal)) return 'line';
    return 'bar';
  }

  function legendRow(series) {
    const row = document.createElement('div');
    row.className = 'chart-legend';
    series.forEach((item) => {
      const span = document.createElement('span');
      const dot = document.createElement('i');
      dot.style.background = item.color;
      span.appendChild(dot);
      span.appendChild(document.createTextNode(item.name));
      row.appendChild(span);
    });
    return row;
  }

  function drawBarChart(prepared) {
    const { labels, series } = prepared;
    const width = 720;
    const height = 340;
    const margin = { top: 24, right: 24, bottom: 64, left: 56 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const scale = niceScale(Math.max(...series.flatMap((item) => item.data), 0), 4);
    const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

    for (let i = 0; i <= 4; i += 1) {
      const y = margin.top + plotH - (i / 4) * plotH;
      svg.appendChild(
        svgEl('line', {
          x1: margin.left,
          y1: y,
          x2: width - margin.right,
          y2: y,
          stroke: '#2a2e26',
          'stroke-width': 1,
        })
      );
      svg.appendChild(
        svgText(margin.left - 10, y + 4, formatNumber((scale.max / 4) * i), {
          'text-anchor': 'end',
          'font-size': 10,
        })
      );
    }

    const groupW = plotW / labels.length;
    const innerW = groupW * 0.72;
    const barW = Math.max(4, Math.min(42, innerW / series.length));
    const rotate = labels.some((label) => label.length > 6) || labels.length > 8;
    const labelY = margin.top + plotH + 20;

    labels.forEach((label, index) => {
      const groupX = margin.left + groupW * index + (groupW - barW * series.length) / 2;
      series.forEach((item, seriesIndex) => {
        const value = Math.max(0, item.data[index] || 0);
        const barH = scale.max ? (value / scale.max) * plotH : 0;
        const rect = svgEl('rect', {
          x: groupX + seriesIndex * barW,
          y: margin.top + plotH - barH,
          width: Math.max(barW - 3, 2),
          height: barH,
          rx: 2,
          fill: item.color,
        });
        const tip = svgEl('title');
        tip.textContent = `${label} · ${item.name}：${formatNumber(value)}`;
        rect.appendChild(tip);
        svg.appendChild(rect);
        if (series.length === 1 && labels.length <= 12 && barH > 16) {
          svg.appendChild(
            svgText(
              groupX + seriesIndex * barW + (barW - 3) / 2,
              margin.top + plotH - barH - 6,
              formatNumber(value),
              { 'text-anchor': 'middle', fill: '#e9e7dc', 'font-size': 10 }
            )
          );
        }
      });

      const x = margin.left + groupW * index + groupW / 2;
      const text = svgText(x, labelY, clipLabel(label, 10), {
        'text-anchor': rotate ? 'end' : 'middle',
        'font-size': 10,
      });
      if (rotate) text.setAttribute('transform', `rotate(-32 ${x} ${labelY})`);
      svg.appendChild(text);
    });

    return svg;
  }

  function drawHorizontalBarChart(prepared) {
    const { labels, series } = prepared;
    const width = 720;
    const rowH = Math.max(30, series.length * 18 + 12);
    const top = 18;
    const bottom = 34;
    const left = Math.min(
      200,
      Math.max(80, Math.max(...labels.map((label) => String(label).length), 1) * 12)
    );
    const right = 64;
    const height = Math.max(180, labels.length * rowH + top + bottom);
    const plotW = width - left - right;
    const plotH = labels.length * rowH;
    const scale = niceScale(Math.max(...series.flatMap((item) => item.data), 0), 4);
    const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

    for (let i = 0; i <= 4; i += 1) {
      const x = left + (i / 4) * plotW;
      svg.appendChild(
        svgEl('line', { x1: x, y1: top, x2: x, y2: top + plotH, stroke: '#2a2e26' })
      );
      svg.appendChild(
        svgText(x, top + plotH + 18, formatNumber((scale.max / 4) * i), {
          'text-anchor': 'middle',
          'font-size': 10,
        })
      );
    }

    labels.forEach((label, index) => {
      const centerY = top + rowH * index + rowH / 2;
      const barH = Math.min(16, (rowH - 8) / series.length);
      svg.appendChild(
        svgText(left - 10, centerY + 4, clipLabel(label, 16), {
          'text-anchor': 'end',
          'font-size': 11,
          fill: '#e9e7dc',
        })
      );
      series.forEach((item, seriesIndex) => {
        const value = Math.max(0, item.data[index] || 0);
        const barW = scale.max ? (value / scale.max) * plotW : 0;
        const rect = svgEl('rect', {
          x: left,
          y: centerY - (barH * series.length) / 2 + seriesIndex * barH,
          width: Math.max(barW, 0),
          height: Math.max(barH - 2, 2),
          rx: 2,
          fill: item.color,
        });
        const tip = svgEl('title');
        tip.textContent = `${label} · ${item.name}：${formatNumber(value)}`;
        rect.appendChild(tip);
        svg.appendChild(rect);
        if (seriesIndex === 0) {
          svg.appendChild(
            svgText(left + barW + 8, centerY + 4, formatNumber(value), {
              'font-size': 10,
              fill: '#e9e7dc',
            })
          );
        }
      });
    });

    return svg;
  }

  function drawLineChart(prepared) {
    const { labels, series } = prepared;
    const width = 720;
    const height = 340;
    const margin = { top: 24, right: 24, bottom: 64, left: 56 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const scale = niceScale(Math.max(...series.flatMap((item) => item.data), 0), 4);
    const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

    for (let i = 0; i <= 4; i += 1) {
      const y = margin.top + plotH - (i / 4) * plotH;
      svg.appendChild(
        svgEl('line', {
          x1: margin.left,
          y1: y,
          x2: width - margin.right,
          y2: y,
          stroke: '#2a2e26',
          'stroke-width': 1,
        })
      );
      svg.appendChild(
        svgText(margin.left - 10, y + 4, formatNumber((scale.max / 4) * i), {
          'text-anchor': 'end',
          'font-size': 10,
        })
      );
    }

    const pointX = (index) =>
      labels.length > 1
        ? margin.left + (index / (labels.length - 1)) * plotW
        : margin.left + plotW / 2;
    const pointY = (value) =>
      margin.top + plotH - (scale.max ? (Math.max(0, value) / scale.max) * plotH : 0);
    const rotate = labels.some((label) => label.length > 6) || labels.length > 8;
    const labelY = margin.top + plotH + 20;

    series.forEach((item) => {
      const points = item.data
        .map((value, index) => `${pointX(index)},${pointY(value)}`)
        .join(' ');
      svg.appendChild(
        svgEl('polyline', {
          points,
          fill: 'none',
          stroke: item.color,
          'stroke-width': 2,
          'stroke-linejoin': 'round',
          'stroke-linecap': 'round',
        })
      );
      item.data.forEach((value, index) => {
        const dot = svgEl('circle', {
          cx: pointX(index),
          cy: pointY(value),
          r: 3.5,
          fill: item.color,
          stroke: '#151812',
          'stroke-width': 1,
        });
        const tip = svgEl('title');
        tip.textContent = `${labels[index]} · ${item.name}：${formatNumber(value)}`;
        dot.appendChild(tip);
        svg.appendChild(dot);
      });
    });

    labels.forEach((label, index) => {
      const x = pointX(index);
      const text = svgText(x, labelY, clipLabel(label, 10), {
        'text-anchor': rotate ? 'end' : 'middle',
        'font-size': 10,
      });
      if (rotate) text.setAttribute('transform', `rotate(-32 ${x} ${labelY})`);
      svg.appendChild(text);
    });

    return svg;
  }

  function drawPieChart(prepared) {
    const labels = prepared.labels;
    const values = prepared.series[0].data.map((value) => Math.max(0, value));
    const total = values.reduce((sum, value) => sum + value, 0);
    const width = 720;
    const height = Math.max(320, labels.length * 22 + 60);
    const cx = 170;
    const cy = height / 2;
    const radius = Math.min(118, height / 2 - 24);
    const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

    if (!(total > 0)) {
      svg.appendChild(
        svgText(width / 2, height / 2, '数据为 0，无法绘制饼图', {
          'text-anchor': 'middle',
          'font-size': 12,
        })
      );
      return svg;
    }

    let angle = -Math.PI / 2;
    values.forEach((value, index) => {
      const slice = (value / total) * Math.PI * 2;
      const color = CHART_COLORS[index % CHART_COLORS.length];
      let shape;
      if (values.length === 1) {
        shape = svgEl('circle', { cx, cy, r: radius, fill: color });
      } else {
        const x1 = cx + radius * Math.cos(angle);
        const y1 = cy + radius * Math.sin(angle);
        const x2 = cx + radius * Math.cos(angle + slice);
        const y2 = cy + radius * Math.sin(angle + slice);
        const large = slice > Math.PI ? 1 : 0;
        shape = svgEl('path', {
          d: `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2} Z`,
          fill: color,
          stroke: '#151812',
          'stroke-width': 2,
        });
      }
      const tip = svgEl('title');
      tip.textContent = `${labels[index]}：${formatNumber(value)}（${(
        (value / total) *
        100
      ).toFixed(1)}%）`;
      shape.appendChild(tip);
      svg.appendChild(shape);
      angle += slice;
    });

    const legendX = 340;
    const legendTop = Math.max(24, (height - labels.length * 22) / 2);
    labels.forEach((label, index) => {
      const y = legendTop + index * 22;
      svg.appendChild(
        svgEl('rect', {
          x: legendX,
          y: y - 8,
          width: 9,
          height: 9,
          rx: 2,
          fill: CHART_COLORS[index % CHART_COLORS.length],
        })
      );
      const percent = ((values[index] / total) * 100).toFixed(1);
      svg.appendChild(
        svgText(
          legendX + 16,
          y,
          `${clipLabel(label, 12)}  ${formatNumber(values[index])} · ${percent}%`,
          { 'font-size': 11, fill: '#e9e7dc' }
        )
      );
    });

    return svg;
  }

  function appendChart(host, columns, rows, requestedType) {
    const prepared = prepareChartData(columns, rows);
    const type = resolveChartType(requestedType, prepared.labels);
    const card = document.createElement('div');
    card.className = 'chart-card';

    const title = document.createElement('div');
    title.className = 'chart-title';
    title.textContent = `${CHART_TITLES[type] || '图表'} · ${prepared.labels.length} 项`;
    card.appendChild(title);

    if (!prepared.series.length) {
      card.appendChild(
        simpleText('div', 'chart-empty', '查询结果中没有可用于绘图的数值列。')
      );
    } else {
      if (type === 'pie') card.appendChild(drawPieChart(prepared));
      else if (type === 'line') card.appendChild(drawLineChart(prepared));
      else if (type === 'hbar') card.appendChild(drawHorizontalBarChart(prepared));
      else card.appendChild(drawBarChart(prepared));
      if (type !== 'pie' && prepared.series.length > 1) {
        card.appendChild(legendRow(prepared.series));
      }
    }

    host.appendChild(card);
    return card;
  }

  // 初始化
  $('mThread').textContent = threadId;
  autosize();
  input.focus();
})();
</script>
</body>
</html>
