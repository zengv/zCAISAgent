[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zcaisagent"
version = "0.1.0"
description = "zCAISAgent: a general-purpose Agent runtime based on Compound AI Systems"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pypdf>=4.0",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
zcaisagent = "zcaisagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zcaisagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["zcaisagent"]
ignore_missing_imports = true
